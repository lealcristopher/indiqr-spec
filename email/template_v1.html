<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IndiQR</title>
  <style type="text/css">

    table { border-collapse: collapse; mso-table-lspace: 0; mso-table-rspace: 0; }
    img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#0D1829;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">

  <!--[if mso]>

  <![endif]-->

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0D1829;">
    <tr>
      <td align="center" style="padding:0;">

        <!-- ── Container ── -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;">
          <tr>
            <td style="background-color:#0D1829;padding:32px 24px 12px;text-align:center;">
              <svg height="28" viewBox="0 0 687 242" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IndiQR" style="display:inline-block;">
                <g transform="translate(36,176) scale(0.2,-0.2)">
                  <path d="M66 0V700H198V0Z" fill="#E4EAF4"/>
                  <path d="M70 0V496H194V431H212Q224 457 257 480.5Q290 504 357 504Q415 504 458.5 477.5Q502 451 526 404.5Q550 358 550 296V0H424V286Q424 342 396.5 370Q369 398 318 398Q260 398 228 359.5Q196 321 196 252V0Z" transform="translate(239,0)" fill="#E4EAF4"/>
                  <path d="M270 -14Q211 -14 159.5 15.5Q108 45 77 102Q46 159 46 240V256Q46 337 77 394Q108 451 159 480.5Q210 510 270 510Q315 510 345.5 499.5Q376 489 395 473Q414 457 424 439H442V700H568V0H444V60H426Q409 32 373.5 9Q338 -14 270 -14ZM308 96Q366 96 405 133.5Q444 171 444 243V253Q444 325 405.5 362.5Q367 400 308 400Q250 400 211 362.5Q172 325 172 253V243Q172 171 211 133.5Q250 96 308 96Z" transform="translate(830,0)" fill="#E4EAF4"/>
                  <path d="M70 0V496H196V0ZM133 554Q99 554 75.5 576Q52 598 52 634Q52 670 75.5 692Q99 714 133 714Q168 714 191 692Q214 670 214 634Q214 598 191 576Q168 554 133 554Z" transform="translate(1443,0)" fill="#E4EAF4"/>
                  <path d="M66 0V700H370Q436 700 485 677Q534 654 561 612Q588 570 588 513V501Q588 438 558 399Q528 360 484 342V324Q524 322 546 296.5Q568 271 568 229V0H436V210Q436 234 423.5 249Q411 264 382 264H198V0ZM198 384H356Q403 384 429.5 409.5Q456 435 456 477V487Q456 529 430 554.5Q404 580 356 580H198Z" transform="translate(2443,0)" fill="#FF5A3C"/>
                  <rect x="1792" y="66" width="568" height="568" rx="168" fill="none" stroke="#FF5A3C" stroke-width="132"/>
                  <rect x="1971" y="245" width="210" height="210" rx="67.2" fill="#FF5A3C"/>
                  <line x1="2188" y1="210" x2="2426" y2="-84" stroke="#FF5A3C" stroke-width="132" stroke-linecap="round"/>
                </g>
              </svg>
            </td>
          </tr>

          <!-- ── Content card ── -->
          <tr>
            <td align="center" style="padding:0 16px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#FBFAF6;border-radius:12px;overflow:hidden;">
                <tr>
                  <td style="padding:40px 32px 32px;">

                    <!-- Greeting -->
                    <p style="margin:0 0 6px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:22px;color:#1B1D24;">
                      Ol&aacute; <strong><!--[if !mso]>-->{%NOME%}<!--<![endif]--><!--[if mso]>{%NOME%}<![endif]--></strong>,
                    </p>

                    <!-- Heading -->
                    <h1 style="margin:16px 0 12px;font-family:'Space Grotesk',Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:24px;font-weight:700;line-height:1.2;letter-spacing:-0.02em;color:#1B1D24;">
                      {%TITULO%}
                    </h1>

                    <!-- Body -->
                    <p style="margin:0 0 16px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:22px;color:#454852;">
                      {%CORPO%}
                    </p>

                    <!-- CTA Button -->
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0 0;">
                      <tr>
                        <td align="center" style="border-radius:8px;">
                          <a href="{%URL_CTA%}" target="_blank" style="display:inline-block;padding:13px 32px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;background-color:#FF5A3C;border-radius:8px;">
                            {%TEXTO_CTA%}
                          </a>
                        </td>
                      </tr>
                    </table>

                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- ── Spacer ── -->
          <tr><td style="height:24px;font-size:0;line-height:0;">&nbsp;</td></tr>

          <!-- ── Footer ── -->
          <tr>
            <td align="center" style="padding:0 24px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="text-align:center;padding:0;">
                    <!-- Footer logo: mini ícone Q -->
                    <svg height="18" viewBox="0 0 288 331" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;margin-bottom:8px;" role="img" aria-hidden="true">
                      <g transform="translate(44,244) scale(0.285714,-0.285714)">
                        <rect x="66" y="66" width="568" height="568" rx="168" fill="none" stroke="#7B90B8" stroke-width="132"/>
                        <rect x="245" y="245" width="210" height="210" rx="67.2" fill="#7B90B8"/>
                        <line x1="462" y1="210" x2="700" y2="-84" stroke="#7B90B8" stroke-width="132" stroke-linecap="round"/>
                      </g>
                    </svg>
                    <p style="margin:0 0 4px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:12px;line-height:18px;color:#7B90B8;">
                      IndiQR &mdash; LealCyber Ltda
                    </p>
                    <p style="margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:12px;line-height:18px;color:#4A5E80;">
                      DPO: <a href="mailto:privacidade@indiqr.lealcyber.com" style="color:#7B90B8;text-decoration:underline;">privacidade@indiqr.lealcyber.com</a>
                    </p>
                    <p style="margin:12px 0 0;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:11px;line-height:16px;color:#4A5E80;">
                      Esta &eacute; uma mensagem autom&aacute;tica da plataforma IndiQR.<br>
                      Caso n&atilde;o queira mais receber notifica&ccedil;&otilde;es, responda a este e-mail.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

  <!--[if mso]>
  </td></tr></table>
  <![endif]-->

</body>
</html>
